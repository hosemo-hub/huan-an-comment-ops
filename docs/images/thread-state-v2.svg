<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <rect width="1600" height="820" fill="#F4F0E8"/><style>.h{font:700 42px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#1E2422}.k{font:700 17px ui-monospace,monospace;letter-spacing:2px}.lane{font:700 25px 'Noto Sans SC','Microsoft YaHei',sans-serif}.t{font:700 22px 'Noto Sans SC','Microsoft YaHei',sans-serif}.s{font:400 17px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#59615E}.m{font:700 15px ui-monospace,monospace}.inv{fill:#F4F0E8}</style>
  <text x="70" y="72" class="k" fill="#E6603D">THREAD FIRST / THREE LANES</text><text x="70" y="126" class="h">线程不是一条直线：先看它正在长成什么</text>
  <g transform="translate(70 185)"><rect width="1460" height="160" rx="26" fill="#FFFCF7" stroke="#4164A8" stroke-width="3"/><rect width="235" height="160" rx="26" fill="#4164A8"/><text x="30" y="58" class="lane inv">有价值地生长</text><text x="30" y="94" class="s inv">问题、经验、纠错</text><text x="30" y="124" class="s inv">继续有新信息</text>
    <g transform="translate(300 52)"><rect width="230" height="58" rx="29" fill="#E8EDF7"/><text x="115" y="37" text-anchor="middle" class="t">萌芽 seed</text><path d="M245 29 H315" stroke="#4164A8" stroke-width="8" stroke-linecap="round"/><path d="M315 29 l-19 -12 v24z" fill="#4164A8"/></g>
    <g transform="translate(630 52)"><rect width="250" height="58" rx="29" fill="#E8EDF7"/><text x="125" y="37" text-anchor="middle" class="t">扩展 expanding</text><path d="M265 29 H335" stroke="#4164A8" stroke-width="8" stroke-linecap="round"/><path d="M335 29 l-19 -12 v24z" fill="#4164A8"/></g>
    <g transform="translate(980 52)"><rect width="390" height="58" rx="29" fill="#1E2422"/><text x="195" y="37" text-anchor="middle" class="t" fill="#fff">沉淀：FAQ / 选题 / 共识</text></g></g>
  <g transform="translate(70 375)"><rect width="1460" height="160" rx="26" fill="#FFFCF7" stroke="#E6603D" stroke-width="3"/><rect width="235" height="160" rx="26" fill="#E6603D"/><text x="30" y="58" class="lane">分歧在升温</text><text x="30" y="94" class="s" fill="#1E2422">反例、争论、站队</text><text x="30" y="124" class="s" fill="#1E2422">旁观者价值优先</text>
    <g transform="translate(300 52)"><rect width="230" height="58" rx="29" fill="#FBE4DD"/><text x="115" y="37" text-anchor="middle" class="t">分歧 dissent</text><path d="M245 29 H315" stroke="#E6603D" stroke-width="8" stroke-linecap="round"/><path d="M315 29 l-19 -12 v24z" fill="#E6603D"/></g>
    <g transform="translate(630 52)"><rect width="250" height="58" rx="29" fill="#FBE4DD"/><text x="125" y="37" text-anchor="middle" class="t">澄清 clarify</text><path d="M265 29 H335" stroke="#E6603D" stroke-width="8" stroke-linecap="round"/><path d="M335 29 l-19 -12 v24z" fill="#E6603D"/></g>
    <g transform="translate(980 52)"><rect width="390" height="58" rx="29" fill="#1E2422"/><text x="195" y="37" text-anchor="middle" class="t" fill="#fff">收口：不争最后一句</text></g></g>
  <g transform="translate(70 565)"><rect width="1460" height="160" rx="26" fill="#1E2422"/><rect width="235" height="160" rx="26" fill="#C99A2E"/><text x="30" y="58" class="lane">风险覆盖一切</text><text x="30" y="94" class="s" fill="#1E2422">隐私、威胁、诈骗</text><text x="30" y="124" class="s" fill="#1E2422">未成年人、自伤他伤</text>
    <text x="320" y="68" class="m" fill="#C99A2E">FROM ANY STAGE</text><text x="320" y="111" class="t" fill="#F4F0E8">最少留证 → 停止追问 → 人工升级 / 平台治理</text><path d="M1175 80 H1355" stroke="#C99A2E" stroke-width="12" stroke-linecap="round"/><path d="M1355 80 l-28 -18 v36z" fill="#C99A2E"/></g>
  <text x="70" y="775" class="s">三条通道没有交叉箭头：增长可以继续，分歧需要收口，风险可以从任何节点直接跳出。</text>
</svg>
