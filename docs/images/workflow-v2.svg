<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620">
  <rect width="1600" height="620" fill="#F4F0E8"/>
  <style>
    .h{font:700 42px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#1E2422}.k{font:700 18px ui-monospace,monospace;letter-spacing:2px;fill:#E6603D}.n{font:700 34px ui-monospace,monospace}.t{font:700 28px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#1E2422}.s{font:400 20px 'Noto Sans SC','Microsoft YaHei',sans-serif;fill:#59615E}.tag{font:700 16px ui-monospace,monospace;fill:#1E2422}.inv{fill:#F4F0E8}
  </style>
  <text x="80" y="78" class="k">COMMENT → JUDGMENT → ACTION</text>
  <text x="80" y="132" class="h">一眼看懂：它不是先写，而是先做四个判断</text>
  <path d="M88 174 H1510" stroke="#1E2422" stroke-width="3"/>
  <g transform="translate(80 220)">
    <rect width="320" height="270" rx="22" fill="#FFFCF7" stroke="#1E2422" stroke-width="3"/>
    <circle cx="55" cy="55" r="28" fill="#4164A8"/><text x="55" y="66" text-anchor="middle" class="n" fill="#fff">1</text>
    <text x="40" y="126" class="t">看清现场</text><text x="40" y="167" class="s">原帖、父子关系、</text><text x="40" y="198" class="s">作者已经做过什么</text>
    <rect x="40" y="224" width="132" height="28" rx="14" fill="#E8EDF7"/><text x="106" y="244" text-anchor="middle" class="tag">EVIDENCE</text>
  </g>
  <path d="M418 355 H470" stroke="#E6603D" stroke-width="10" stroke-linecap="round"/><path d="M470 355 l-22 -14 v28z" fill="#E6603D"/>
  <g transform="translate(480 220)">
    <rect width="320" height="270" rx="22" fill="#FFFCF7" stroke="#1E2422" stroke-width="3"/>
    <circle cx="55" cy="55" r="28" fill="#E6603D"/><text x="55" y="66" text-anchor="middle" class="n" fill="#fff">2</text>
    <text x="40" y="126" class="t">判断线程</text><text x="40" y="167" class="s">是问题、反例、故事，</text><text x="40" y="198" class="s">还是争论、偏航、风险</text>
    <rect x="40" y="224" width="126" height="28" rx="14" fill="#FBE4DD"/><text x="103" y="244" text-anchor="middle" class="tag">THREAD</text>
  </g>
  <path d="M818 355 H870" stroke="#E6603D" stroke-width="10" stroke-linecap="round"/><path d="M870 355 l-22 -14 v28z" fill="#E6603D"/>
  <g transform="translate(880 220)">
    <rect width="320" height="270" rx="22" fill="#FFFCF7" stroke="#1E2422" stroke-width="3"/>
    <circle cx="55" cy="55" r="28" fill="#7C9B72"/><text x="55" y="66" text-anchor="middle" class="n" fill="#fff">3</text>
    <text x="40" y="126" class="t">选最小动作</text><text x="40" y="167" class="s">回复、点赞、观察、</text><text x="40" y="198" class="s">收口，或交给人处理</text>
    <rect x="40" y="224" width="118" height="28" rx="14" fill="#E9F0E5"/><text x="99" y="244" text-anchor="middle" class="tag">ACTION</text>
  </g>
  <path d="M1218 355 H1270" stroke="#E6603D" stroke-width="10" stroke-linecap="round"/><path d="M1270 355 l-22 -14 v28z" fill="#E6603D"/>
  <g transform="translate(1280 220)">
    <rect width="240" height="270" rx="22" fill="#1E2422"/>
    <circle cx="55" cy="55" r="28" fill="#C99A2E"/><text x="55" y="66" text-anchor="middle" class="n" fill="#1E2422">4</text>
    <text x="40" y="126" class="t inv">写停止条件</text><text x="40" y="167" class="s inv">什么情况下</text><text x="40" y="198" class="s inv">不再继续</text>
    <path d="M40 238 H190" stroke="#E6603D" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="80" y="560" class="s">回复只是动作之一。最值钱的是：知道哪条值得继续，哪条应该停。</text>
</svg>
